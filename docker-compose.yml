services:
  garmin-autolike:
    build: .
    restart: unless-stopped
    environment:
      - GARMIN_EMAIL=${GARMIN_EMAIL}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-120}
      - FEED_LIMIT=${FEED_LIMIT:-25}
      # LIKE_ON_STARTUP=true will like already-visible feed items on first run.
      # Keep false to only like items that appear after the bot has started.
      - LIKE_ON_STARTUP=${LIKE_ON_STARTUP:-false}
      - LIKED_CACHE_SIZE=${LIKED_CACHE_SIZE:-5000}
      # Set RUN_ONCE=true to process one cycle and exit (useful for cron/jobs)
      - RUN_ONCE=${RUN_ONCE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - garmin_data:/data

volumes:
  garmin_data:
