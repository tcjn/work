services:
  garmin-autolike:
    build: .
    restart: unless-stopped
    environment:
      - GARMIN_EMAIL=${GARMIN_EMAIL}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-300}
      - FEED_LIMIT=${FEED_LIMIT:-10}
      # LIKE_MODE options:
      # - new: only like activities that newly appear in feed between checks
      # - last10: always try to like last FEED_LIMIT activities
      - LIKE_MODE=${LIKE_MODE:-new}
      # Set RUN_ONCE=true to process one cycle and exit (useful for cron/jobs)
      - RUN_ONCE=${RUN_ONCE:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - garmin_data:/data

volumes:
  garmin_data:
